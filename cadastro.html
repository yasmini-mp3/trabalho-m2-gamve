<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMv3 - Cadastro</title>
    <style>
        :root {
            --bg-color: #050505;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-yellow: #f9d423;
            --dark-gray: #0d0d0d;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Centralizado */
        header {
            width: 100%;
            padding: 30px 40px;
            display: flex;
            justify-content: center; /* Centraliza a logo */
            align-items: center;
            border-bottom: 2px solid var(--neon-cyan);
            background: rgba(0, 0, 0, 0.9);
            box-sizing: border-box;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--neon-cyan);
            text-decoration: none;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .nav-links a {
            color: var(--neon-yellow);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: 0.3s;
            position: absolute; /* Tira do fluxo para não afetar o centro da logo */
            left: 40px;
        }

        .nav-links a:hover {
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        /* Container Centralizado */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: var(--dark-gray);
            border: 1px solid #222;
            padding: 40px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            text-align: left; /* Mantém os textos do formulário alinhados à esquerda */
        }

        .register-card::after {
            content: "";
            position: absolute;
            top: 0; right: 0;
            width: 30px; height: 30px;
            border-top: 3px solid var(--neon-pink);
            border-right: 3px solid var(--neon-pink);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            border-left: 5px solid var(--neon-pink);
            padding-left: 15px;
            text-transform: uppercase;
            text-align: center; /* Centraliza o título do card */
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            color: var(--neon-cyan);
            font-size: 0.75rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 1px solid #333;
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--neon-cyan); }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: var(--neon-cyan);
            color: black;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .switch-page {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: #777;
        }

        .switch-page a {
            color: var(--neon-pink);
            text-decoration: none;
            font-weight: bold;
        }

        .switch-page a:hover { text-decoration: underline; }

        footer {
            padding: 20px 40px;
            border-top: 1px solid #222;
            text-align: center;
            font-size: 0.7rem;
            color: #444;
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav-links">
            <a href="menu.html"> Início</a>
        </nav>
        <a header>
            <img src="logo.png" width="50" height="50" alt="logo" style="display: inline-block; vertical-align: middle;">
            <span style="font-weight: bold; font-size: 20px;">GamV3</span>
    </header>

    <main>
        <div class="register-card">
            <h1>Criar Perfil</h1>
            
            <form>
                <div class="form-group">
                    <label>Player Tag (Nome)</label>
                    <input type="text" placeholder="Digite seu nick...">
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="email@provedor.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit">Registrar Agora</button>
            </form>

            <div class="switch-page">
                Já é um membro? <a href="login.html">Faça o Login aqui</a>
            </div>
        </div>
    </main>

    <footer>
        © 2026 GAMv3 - SISTEMA DE APRENDIZADO GAMIFICADO
    </footer>

</body>
</html>
